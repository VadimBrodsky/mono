apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgres

resources:
  - ../../base
  - endpointslice.yaml

patches:
  - target: 
      group: ""
      version: v1
      kind: Service
      name: postgres
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 15432

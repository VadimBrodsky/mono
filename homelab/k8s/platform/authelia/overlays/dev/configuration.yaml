apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    server:
      address: 'tcp://:9091'
      # Skip the Docker healthcheck file write; Kubernetes probes still use /api/health.
      disable_healthcheck: true

    log:
      level: info

    authentication_backend:
      file:
        path: /users/users_database.yml
        watch: true
        password:
          algorithm: argon2
          argon2:
            variant: argon2id
            iterations: 3
            memory: 65536
            parallelism: 4
            key_length: 32
            salt_length: 16
      password_reset:
        disable: true

    access_control:
      default_policy: deny
      rules:
        - domain: linkding.dev.brodsky.club
          policy: one_factor

    session:
      cookies:
        - domain: dev.brodsky.club
          authelia_url: https://auth.dev.brodsky.club

    storage:
      local:
        path: /data/db.sqlite3

    notifier:
      filesystem:
        filename: /data/notifications.txt

    identity_providers:
      oidc:
        jwks:
          - key_id: authelia
            algorithm: RS256
            use: sig
            key: {{ secret "/secrets/oidc_issuer_private_key" | mindent 10 "|" | msquote }}
        clients:
          - client_id: linkding
            client_name: Linkding
            client_secret: {{ secret "/secrets/linkding_client_secret_hash" | mindent 10 "|" | msquote }}
            public: false
            authorization_policy: one_factor
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://linkding.dev.brodsky.club/oidc/callback/
            scopes:
              - openid
              - email
              - profile
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_post

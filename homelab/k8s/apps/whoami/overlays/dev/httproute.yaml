apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: http
    - name: traefik
      namespace: traefik
      sectionName: https
  hostnames:
    - kind.brodsky.club
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /whoami
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: whoami
          port: 80

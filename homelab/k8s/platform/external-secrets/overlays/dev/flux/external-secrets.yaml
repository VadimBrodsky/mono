apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/external-secrets/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 10m
  wait: true

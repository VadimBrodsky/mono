apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.4/cmd/k8s-operator/deploy/manifests/operator.yaml
  - oauth-secret.yaml

patches:
  - target:
      version: v1
      kind: Namespace
      name: tailscale
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tailscale
        labels:
          # The operator creates privileged Service proxy Pods in this
          # dev-only namespace.
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/enforce-version: latest
  - target:
      version: v1
      kind: Secret
      name: operator-oauth
      namespace: tailscale
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: operator-oauth
        namespace: tailscale
      $patch: delete

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - oidc-external-secret.yaml

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: linkding
      namespace: linkding
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: linkding.dev.brodsky.club
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https-dev-wildcard
      - op: add
        path: /spec/parentRefs/0
        value:
          name: traefik
          namespace: traefik
          sectionName: http
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: linkding
      namespace: linkding
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: linkding
        namespace: linkding
      spec:
        template:
          spec:
            hostAliases:
              - ip: 100.112.137.110
                hostnames:
                  - auth.dev.brodsky.club
            containers:
              - name: linkding
                env:
                  - name: LD_CSRF_TRUSTED_ORIGINS
                    value: https://linkding.dev.brodsky.club
                  - name: LD_ENABLE_OIDC
                    value: "True"
                  - name: LD_DISABLE_LOGIN_FORM
                    value: "True"
                  - name: OIDC_USE_PKCE
                    value: "True"
                  - name: OIDC_OP_AUTHORIZATION_ENDPOINT
                    value: https://auth.dev.brodsky.club/api/oidc/authorization
                  - name: OIDC_OP_TOKEN_ENDPOINT
                    value: https://auth.dev.brodsky.club/api/oidc/token
                  - name: OIDC_OP_USER_ENDPOINT
                    value: https://auth.dev.brodsky.club/api/oidc/userinfo
                  - name: OIDC_OP_JWKS_ENDPOINT
                    value: https://auth.dev.brodsky.club/jwks.json
                  - name: OIDC_RP_CLIENT_ID
                    value: linkding
                  - name: OIDC_RP_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: linkding-oidc
                        key: client-secret
                  - name: OIDC_RP_SIGN_ALGO
                    value: RS256
                  - name: OIDC_RP_SCOPES
                    value: openid email profile

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-homelab-dev
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: observability-grafana/credential
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-homelab-dev
    kind: ClusterSecretStore
  target:
    name: alertmanager-pushover
    creationPolicy: Owner
  data:
    - secretKey: user-key
      remoteRef:
        key: observability-pushover/user-key
    - secretKey: app-token
      remoteRef:
        key: observability-pushover/app-token

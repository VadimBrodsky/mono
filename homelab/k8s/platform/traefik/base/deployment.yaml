apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik

  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik

    spec:
      serviceAccountName: traefik

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: traefik
          image: traefik:v3.7.17

          args:
            - --providers.kubernetesgateway=true
            - --entryPoints.web.address=:8080
            - --entrypoints.health.address=:9000
            - --ping=true
            - --ping.entrypoint=health
            - --log.level=INFO
            - --accesslog=true
            # - --api.insecure=true   # local dev only

          ports:
            - name: web
              containerPort: 8080
            - name: health
              containerPort: 9000

          readinessProbe:
            httpGet:
              path: /ping
              port: health

          livenessProbe:
            httpGet:
              path: /ping
              port: health

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

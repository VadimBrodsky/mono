apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-stash
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/apps/stash/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 30m
  dependsOn:
    - name: traefik

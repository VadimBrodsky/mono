apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-db
  namespace: linkding
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-homelab-dev
    kind: ClusterSecretStore
  target:
    name: linkding-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: linkding/credential

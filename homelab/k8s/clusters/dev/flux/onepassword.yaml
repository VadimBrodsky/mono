apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: onepassword-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/external-secrets/onepassword/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 10m
  dependsOn:
    - name: external-secrets
    - name: cert-manager
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: cloudflare-api-token
      namespace: cert-manager

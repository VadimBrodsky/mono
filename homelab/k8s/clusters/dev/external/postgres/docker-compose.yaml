services:
  postgres:
    image: postgres:15.17-bookworm
    container_name: homelab-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_dev
      POSTGRES_USER: app_dev
      POSTGRES_PASSWORD: dev-only-change-me
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_dev -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1-standalone
    container_name: homelab-dev-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DEFAULT_DB_NAME: app_dev
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USER: app_dev
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  postgres-data:

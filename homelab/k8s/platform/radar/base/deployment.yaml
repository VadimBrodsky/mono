apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar
    spec:
      serviceAccountName: radar
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radar
          image: ghcr.io/skyhook-io/radar:1.20.2
          imagePullPolicy: IfNotPresent
          args:
            - --port=9280
            - --listen-address=0.0.0.0
            - --no-browser
            - --allowed-hosts=radar.kind.brodsky.club
            - --no-mcp
          ports:
            - name: http
              containerPort: 9280
              protocol: TCP
          env:
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}

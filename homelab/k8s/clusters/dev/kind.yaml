apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: homelab-dev

networking:
  apiServerAddress: "127.0.0.1"

nodes:
- role: control-plane
  extraPortMappings:
    - containerPort: 30080
      hostPort: 8080
      listenAddress: "127.0.0.1"
      protocol: TCP
    - containerPort: 30443
      hostPort: 443
      listenAddress: "127.0.0.1"
      protocol: TCP
- role: worker
- role: worker

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          volumeMounts:
            - name: cupdate-dashboard
              mountPath: /etc/grafana/provisioning/dashboards/cupdate.yaml
              subPath: cupdate-provider.yaml
              readOnly: true
            - name: cupdate-dashboard
              mountPath: /etc/grafana/dashboards/cupdate/cupdate.json
              subPath: cupdate.json
              readOnly: true
      volumes:
        - name: cupdate-dashboard
          configMap:
            name: grafana-cupdate-dashboard

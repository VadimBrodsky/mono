apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: linkding
      namespace: linkding
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: linkding.dev.brodsky.club
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https-dev-wildcard
      - op: add
        path: /spec/parentRefs/0
        value:
          name: traefik
          namespace: traefik
          sectionName: http
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: linkding
      namespace: linkding
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: linkding
        namespace: linkding
      spec:
        template:
          spec:
            containers:
              - name: linkding
                env:
                  - name: LD_CSRF_TRUSTED_ORIGINS
                    value: https://linkding.dev.brodsky.club

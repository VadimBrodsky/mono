apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.47.0-alpine
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          env:
            - name: LD_DB_ENGINE
              value: postgres
            - name: LD_DB_DATABASE
              value: linkding
            - name: LD_DB_USER
              value: postgres
            - name: LD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkding-db
                  key: password
            - name: LD_DB_HOST
              value: postgres.postgres.svc.cluster.local
            - name: LD_DB_PORT
              value: "5432"
            - name: LD_CSRF_TRUSTED_ORIGINS
              value: https://link.kind.brodsky.club

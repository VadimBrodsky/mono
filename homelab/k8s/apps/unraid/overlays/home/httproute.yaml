apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unraid
  namespace: unraid
spec:
  hostnames:
    - tower.brodsky.club
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: unraid
          port: 443

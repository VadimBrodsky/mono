apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-credentials
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-homelab-dev
    kind: ClusterSecretStore
  target:
    name: authelia-credentials
    creationPolicy: Owner
  data:
    - secretKey: users_database.yml
      remoteRef:
        key: authelia-dev/users-database
    - secretKey: session_secret
      remoteRef:
        key: authelia-dev/session-secret
    - secretKey: storage_encryption_key
      remoteRef:
        key: authelia-dev/storage-encryption-key
    - secretKey: reset_password_jwt_secret
      remoteRef:
        key: authelia-dev/reset-password-jwt-secret
    - secretKey: oidc_hmac_secret
      remoteRef:
        key: authelia-dev/oidc-hmac-secret
    - secretKey: oidc_issuer_private_key
      remoteRef:
        key: authelia-dev/oidc-issuer-private-key.pem
    - secretKey: linkding_client_secret_hash
      remoteRef:
        key: authelia-dev/linkding-client-secret-hash

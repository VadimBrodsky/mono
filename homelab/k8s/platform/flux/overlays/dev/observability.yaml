apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/observability/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 10m
  dependsOn:
    - name: longhorn
    - name: traefik
    - name: onepassword-config
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: grafana-admin
      namespace: observability
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: alertmanager-pushover
      namespace: observability
    - apiVersion: apps/v1
      kind: StatefulSet
      name: tempo
      namespace: observability

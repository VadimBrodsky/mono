apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-flux-reconcile
  namespace: flux-system
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [patch]
  # Radar's "Sync with source" action also patches the shared GitRepository.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [homelab]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-flux-reconcile
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-flux-reconcile
subjects:
  - kind: ServiceAccount
    name: radar
    namespace: radar

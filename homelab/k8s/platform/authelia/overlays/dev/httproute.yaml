apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: http
    - name: traefik
      namespace: traefik
      sectionName: https-dev-wildcard
  hostnames:
    - auth.dev.brodsky.club
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authelia
          port: 9091

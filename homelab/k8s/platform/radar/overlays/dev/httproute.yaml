apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radar
  namespace: radar
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: http
    - name: traefik
      namespace: traefik
      sectionName: https-wildcard
  hostnames:
    - radar.kind.brodsky.club
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radar
          port: 9280

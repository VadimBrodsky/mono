apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: https-dev-wildcard
  hostnames:
    - grafana.dev.brodsky.club
  rules:
    - backendRefs:
        - name: grafana
          port: 3000

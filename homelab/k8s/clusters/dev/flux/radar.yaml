apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radar
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/radar/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 10m
  dependsOn:
    - name: traefik
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: radar
      namespace: radar

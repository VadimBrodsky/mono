apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-wallabag
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/apps/wallabag/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 30m
  dependsOn:
    - name: traefik
    - name: dev-postgres

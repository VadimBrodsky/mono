apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-credentials
  namespace: miniflux
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-homelab-dev
    kind: ClusterSecretStore
  target:
    name: miniflux-credentials
    creationPolicy: Owner
  data:
    - secretKey: credential
      remoteRef:
        key: miniflux/credential

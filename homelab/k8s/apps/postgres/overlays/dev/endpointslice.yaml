apiVersion: discovery.k8s.io/v1
kind: EndpointSlice

addressType: IPv4
endpoints:
  - addresses:
      # Talos QEMU's host gateway; the dev PostgreSQL container publishes port 15432 here.
      - 10.200.0.1
    conditions:
      ready: true

metadata:
  labels:
    endpointslice.kubernetes.io/managed-by: homelab-manual
    kubernetes.io/service-name: postgres
  name: postgres

ports:
  - name: postgres
    port: 15432
    protocol: TCP

services:
  postgres:
    image: postgres:15.17-bookworm
    container_name: homelab-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_dev
      POSTGRES_USER: app_dev
      POSTGRES_PASSWORD: dev-only-change-me
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_dev -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

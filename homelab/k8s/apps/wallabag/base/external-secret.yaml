apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wallabag-credentials
  namespace: wallabag
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-homelab-dev
    kind: ClusterSecretStore
  target:
    name: wallabag-credentials
    creationPolicy: Owner
  data:
    - secretKey: credential
      remoteRef:
        key: wallabag/credential

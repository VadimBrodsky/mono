apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: romm
  namespace: romm
spec:
  hostnames:
    - romm.brodsky.club
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: romm
          port: 8970

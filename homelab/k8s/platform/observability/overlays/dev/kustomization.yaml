apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - grafana-route.yaml
  - external-secrets.yaml

images:
  - name: grafana/grafana
    newTag: "12.4.14"

configMapGenerator:
  - name: grafana-cupdate-dashboard
    namespace: observability
    files:
      - cupdate-provider.yaml
      - cupdate.json

patches:
  - path: grafana-cupdate.yaml

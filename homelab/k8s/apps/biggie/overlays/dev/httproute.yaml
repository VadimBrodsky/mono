apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: biggie
  namespace: biggie
spec:
  hostnames:
  - biggie.localhost
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: http
  rules:
  - backendRefs:
    - name: biggie
      port: 8006
    matches:
    - path:
        type: PathPrefix
        value: /

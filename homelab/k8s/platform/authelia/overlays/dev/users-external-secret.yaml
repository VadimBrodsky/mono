apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-homelab-dev
    kind: ClusterSecretStore
  target:
    name: authelia-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users_database.yml: |
          users:
            {{ .user_01_username | quote }}:
              displayname: {{ .user_01_displayname | quote }}
              password: {{ .user_01_password_hash | quote }}
              email: {{ .user_01_email | quote }}
              groups: []
  data:
    - secretKey: user_01_username
      remoteRef:
        key: authelia-user-01/username
    - secretKey: user_01_displayname
      remoteRef:
        key: authelia-user-01/displayname
    - secretKey: user_01_password_hash
      remoteRef:
        key: authelia-user-01/password-hash
    - secretKey: user_01_email
      remoteRef:
        key: authelia-user-01/email

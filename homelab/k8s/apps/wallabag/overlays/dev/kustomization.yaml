apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: wallabag
      namespace: wallabag
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: wallabag.dev.brodsky.club
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https-dev-wildcard
      - op: add
        path: /spec/parentRefs/0
        value:
          name: traefik
          namespace: traefik
          sectionName: http
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: wallabag
      namespace: wallabag
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: wallabag
        namespace: wallabag
      spec:
        template:
          spec:
            containers:
              - name: wallabag
                env:
                  - name: SYMFONY__ENV__DOMAIN_NAME
                    value: https://wallabag.dev.brodsky.club

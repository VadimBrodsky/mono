apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stash
  namespace: stash
spec:
  hostnames:
    - kind.brodsky.club
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: http
    - name: traefik
      namespace: traefik
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /stash
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: stash
          port: 6969

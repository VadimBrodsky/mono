apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-oidc
  namespace: linkding
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-homelab-dev
    kind: ClusterSecretStore
  target:
    name: linkding-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: authelia-dev/linkding-client-secret

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/gateway-api
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/external-secrets/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/cert-manager/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/longhorn/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 20m
  wait: true

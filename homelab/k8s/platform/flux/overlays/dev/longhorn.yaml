apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/longhorn/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 20m
  wait: true
  dependsOn:
    - name: traefik

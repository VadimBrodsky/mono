apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stash
  namespace: stash
spec:
  hostnames:
    - stash.brodsky.club
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stash
          port: 6969

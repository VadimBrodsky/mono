apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/VadimBrodsky/mono.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  path: ./homelab/k8s/clusters/home/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 30m
  wait: true

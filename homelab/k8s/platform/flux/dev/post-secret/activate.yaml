apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-post-secret
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 30m
  wait: true
  dependsOn:
    - name: gateway-api-crds
    - name: external-secrets
    - name: cert-manager

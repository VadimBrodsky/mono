apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: sample-app
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - httproute.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cupdate
      namespace: cupdate
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cupdate
        namespace: cupdate
      spec:
        template:
          spec:
            automountServiceAccountToken: true
            serviceAccountName: cupdate

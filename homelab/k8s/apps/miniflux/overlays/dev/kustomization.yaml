apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: miniflux
      namespace: miniflux
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: rss.kind.brodsky.club
      - op: add
        path: /spec/parentRefs/0
        value:
          name: traefik
          namespace: traefik
          sectionName: http

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Flux Kustomization declarations activated after the dev 1Password token exists.
# This root is consumed by the dev-post-secret Flux Kustomization only.
resources:
  - platform/external-secrets/onepassword/dev/flux
  - platform/cert-manager/dev/flux
  - platform/cert-manager/production/flux
  - platform/traefik/overlays/dev/flux
  - apps/whoami/overlays/dev/flux
  - apps/biggie/overlays/dev/flux
  - apps/unraid/overlays/dev/flux
  - apps/audiobookshelf/overlays/dev/flux
  - apps/grimmory/overlays/dev/flux
  - apps/immich/overlays/dev/flux
  - apps/romm/overlays/dev/flux
  - apps/stash/overlays/dev/flux

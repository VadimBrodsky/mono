apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: stash
      namespace: stash
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: kind.brodsky.club
      - op: add
        path: /spec/parentRefs/0
        value:
          name: traefik
          namespace: traefik
          sectionName: http
      - op: replace
        path: /spec/rules/0/matches/0/path/value
        value: /stash
      - op: add
        path: /spec/rules/0/filters
        value:
          - type: URLRewrite
            urlRewrite:
              path:
                type: ReplacePrefixMatch
                replacePrefixMatch: /

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - dashboard-route.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: traefik
      namespace: traefik
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --providers.kubernetesgateway.statusaddress.hostname=localhost
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --api.insecure=true
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --entrypoints.traefik.address=:9001
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: traefik
          containerPort: 9001
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --entrypoints.websecure.address=:8443
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: websecure
          containerPort: 8443
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: traefik
      namespace: traefik
    patch: |-
      - op: add
        path: /spec/listeners/-
        value:
          name: https
          protocol: HTTPS
          port: 8443
          hostname: kind.brodsky.club
          tls:
            mode: Terminate
            certificateRefs:
              - name: dev-kind-tls
          allowedRoutes:
            kinds:
              - kind: HTTPRoute
            namespaces:
              from: All
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: traefik
      namespace: traefik
    patch: |-
      - op: add
        path: /spec/listeners/-
        value:
          name: https-wildcard
          protocol: HTTPS
          port: 8443
          hostname: '*.kind.brodsky.club'
          tls:
            mode: Terminate
            certificateRefs:
              - name: dev-kind-tls
          allowedRoutes:
            kinds:
              - kind: HTTPRoute
            namespaces:
              from: All
  - target:
      version: v1
      kind: Service
      name: traefik
      namespace: traefik
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: traefik
        namespace: traefik
      spec:
        type: NodePort
        externalTrafficPolicy: Cluster
        ports:
          - name: web
            port: 80
            targetPort: web
            nodePort: 30080
          - name: websecure
            port: 443
            targetPort: websecure
            nodePort: 30443
          - name: traefik
            port: 9001
            targetPort: traefik

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authelia
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/platform/authelia/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 10m
  dependsOn:
    - name: longhorn
    - name: traefik
    - name: onepassword-config
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: authelia-credentials
      namespace: authelia
    - apiVersion: apps/v1
      kind: Deployment
      name: authelia
      namespace: authelia

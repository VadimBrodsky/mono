apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.4/cmd/k8s-operator/deploy/manifests/operator.yaml
  - oauth-secret.yaml

patches:
  - target:
      version: v1
      kind: Secret
      name: operator-oauth
      namespace: tailscale
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: operator-oauth
        namespace: tailscale
      $patch: delete

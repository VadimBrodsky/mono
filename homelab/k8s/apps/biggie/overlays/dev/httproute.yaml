apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: biggie
  namespace: biggie
spec:
  hostnames:
  - kind.brodsky.club
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: http
  - name: traefik
    namespace: traefik
    sectionName: https
  rules:
  - backendRefs:
    - name: biggie
      port: 8006
    matches:
    - path:
        type: PathPrefix
        value: /biggie
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /

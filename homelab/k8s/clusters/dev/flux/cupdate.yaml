apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cupdate
  namespace: flux-system
spec:
  interval: 10m
  path: ./homelab/k8s/apps/cupdate/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 10m
  dependsOn:
    - name: longhorn
    - name: traefik
    - name: observability
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cupdate
      namespace: cupdate
